name: Pruebas de base de datos

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sqlite-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar pruebas de integridad SQLite
        run: python -m unittest discover -s Sql/tests -v
