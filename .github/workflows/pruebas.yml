name: Pruebas DasAuto

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ejecutar pruebas de base de datos
        run: python -m unittest discover -s Sql/tests -v
