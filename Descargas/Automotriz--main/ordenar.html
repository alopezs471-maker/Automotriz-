   <script>
document.addEventListener("DOMContentLoaded", () => {
    const car = document.querySelector(".car-cursor");
    if (!car) return;

    // Variables de posición del mouse
    let mX = window.innerWidth / 2;
    let mY = window.innerHeight / 2;

    // Variables físicas del coche
    let cX = mX, cY = mY;   // Posición actual del coche
    let vX = 0, vY = 0;     // Velocidad actual en ejes X e Y
    
    // --- PARÁMETROS DEL LLAVERO (Puedes tunearlos a tu gusto) ---
    const elasticidad = 0.12;  // Qué tan fuerte te jala el "hilo" del llavero (0.01 a 0.3)
    const friccion = 0.82;     // Resistencia al aire. Evita que rebote infinitamente (0.7 a 0.95)
    const gravedad = 0.35;     // Peso del carro hacia abajo. Hace que "cuelgue" cuando te detienes
    const largoHilo = 15;      // Distancia mínima de separación entre el mouse y el coche

    window.addEventListener("mousemove", (e) => {
        mX = e.clientX;
        mY = e.clientY;
    });

    function updateLlaveroPhysics() {
        // 1. Calcula la distancia/fuerza elástica hacia el mouse
        let fuerzaX = (mX - cX) * elasticidad;
        let fuerzaY = (mY - cY) * elasticidad;

        // 2. Aplicamos las fuerzas a la velocidad (sumando gravedad hacia abajo)
        vX += fuerzaX;
        vY += fuerzaY + gravedad;

        // 3. Aplicamos fricción para amortiguar el movimiento y que sea fluido
        vX *= friccion;
        vY *= friccion;

        // 4. Actualizamos la posición real del coche
        cX += vX;
        cY += vY;

        // 5. Renderizado en pantalla
        car.style.left = `${cX}px`;
        car.style.top = `${cY}px`;

        // 6. ROTACIÓN: Hacemos que la trompa siempre mire al punto de agarre (el mouse)
        const dx = mX - cX;
        const dy = mY - cY;
        
        // Solo rota si está lo suficientemente lejos para evitar temblores raros
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
            // Ajustamos +90 porque el coche en el SVG original mira hacia arriba
            const angle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
            car.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
        }

        requestAnimationFrame(updateLlaveroPhysics);
    }
    
    // Iniciamos el motor físico
    requestAnimationFrame(updateLlaveroPhysics);

    // Mantenemos tus zonas interactivas de PQRS intactas
    const zonasPqrs = document.querySelectorAll("a, button, input, select, textarea, .btn-pqrs-submit, .nav-links a");
    zonasPqrs.forEach(item => {
        item.addEventListener("mouseenter", () => document.body.classList.add("car-hover-active"));
        item.addEventListener("mouseleave", () => document.body.classList.remove("car-hover-active"));
    });
});
</script>
